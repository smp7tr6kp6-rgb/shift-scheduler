        text-green-800 bg-green-100
    ">
    
        Approved
    
</span>

<script>
(function () {
    
    if (window.updateStatusText) return;

    const STATUS_STYLES = {
        approved: {
            text: "Approved",
            classes: ["text-green-800", "bg-green-100"]
        },
        pending: {
            text: "Pending",
            classes: ["text-yellow-800", "bg-yellow-100"]
        },
        none: {
            text: "No Schedule Submitted",
            classes: ["text-gray-800", "bg-gray-100"]
        },
        denied: {
            text: "Denied",
            classes: ["text-red-800", "bg-red-100"]
        }
    };

    const ALL_STATUS_CLASSES = [
        "text-green-800", "bg-green-100",
        "text-yellow-800", "bg-yellow-100",
        "text-gray-800", "bg-gray-100",
        "text-red-800", "bg-red-100"
    ];

    window.updateStatusText = function (elementId, statusKey) {
        const el = document.getElementById(elementId);
        if (!el) return;

        const status = STATUS_STYLES[statusKey];
        if (!status) return;

        el.classList.remove(...ALL_STATUS_CLASSES);
        el.classList.add(...status.classes);
        el.textContent = status.text;
    };
})();
</script>

        transition: opacity 80ms linear, transform 80ms linear;
    }
    .schedule-tooltip.is-visible{
        opacity: 1;
        transform: translateY(0);
    }

</style>

<script>
(function (
    scheduleName,
    baseScheduleJson,
    newScheduleJson,
    teamScheduleJson,
    editable,
    editBase,
    callbackURL,
    selectedWeek
) {
    if (!window.__scheduleInits) window.__scheduleInits = [];

    window.__scheduleInits.push(function () {

         

        const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
        const DISPLAY_DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        const displayDays = DISPLAY_DAYS;
        const START_HOUR =  7 ;
        const END_HOUR =  19 ;
        const SELECTABLE_MINUTES = [0,10,15,20,30,40,45,50];
        const MIN_HOURS_PER_DAY = 3;
        const MAX_HOURS_PER_DAY = 9;

         

        let masterSchedule = {};
        let currentSchedule = {};
        let teamSchedule = {};
        let originalSchedule = {};
        let isDragging = false;
        let dragMode = null;

         

        const container = document.getElementById(scheduleName);
        const editBtn = document.getElementById(scheduleName + "-edit-btn");
        const cancelBtn = document.getElementById(scheduleName + "-cancel-btn");
        const submitBtn = document.getElementById(scheduleName + "-submit-btn");
        const submitForm = document.getElementById(scheduleName + "-submit-form");
        const scheduleInput = document.getElementById(scheduleName + "-schedule-input");
        const totalEl = document.getElementById(scheduleName + "-total-hours");
        const diffEl = document.getElementById(scheduleName + "-total-diff-hours");

        if (!container) return;

        const tooltip = document.createElement("div");
        tooltip.className = "schedule-tooltip";
        document.body.appendChild(tooltip);

        function showTooltip(target, text) {
            tooltip.textContent = text;
            const r = target.getBoundingClientRect();
            const x = Math.min(window.innerWidth - 10, Math.max(10, r.left + r.width / 2));
            const y = Math.max(10, r.top - 10);
            tooltip.style.left = x + "px";
            tooltip.style.top = y + "px";
            tooltip.style.transform = "translate(-50%, -100%)";
            tooltip.classList.add("is-visible");
        }

        function hideTooltip() {
            tooltip.classList.remove("is-visible");
        }


         

        const fmtTime = (minute) => {
            const h24 = Math.floor(minute / 60);
            const m = minute % 60;
            const ampm = h24 < 12 ? "AM" : "PM";
            const h12 = h24 % 12 || 12;
            return `${h12}:${String(m).padStart(2, "0")} ${ampm}`;
        };

        const describeSlot = (day, minute) => {
            const state = slotState(day, minute);

            let status = "Empty";
            if (state === "bg-blue-slot") status = "Normal schedule";
            if (state === "bg-green-slot") status = "Added";
            if (state === "bg-red-slot") status = "Removed";
            if (state === "bg-unselectable") status = "Unavailable";

            const start = fmtTime(minute);
            const end = fmtTime(minute + slotLength(minute));
            return `${day} ${start}–${end}: ${status}`;
        };


        const emptySchedule = () => {
            const s = {};
            DAYS.forEach(d => s[d] = []);
            return s;
        };

        const availableSchedule = () => {
            const s = emptySchedule();
            DAYS.forEach(day => {
                for (let hour = START_HOUR; hour < END_HOUR; hour++) {
                    SELECTABLE_MINUTES.forEach(minute => {
                        const time = hour * 60 + minute;
                        if (time >= 450 && time <= 1110) s[day].push(time);
                    });
                }
            });
            return s;
        };

        const clone = obj => JSON.parse(JSON.stringify(obj));

        const sanitize = raw => {
            const s = emptySchedule();
            if (!raw) return s;
            DAYS.forEach(day => {
                s[day] = (raw[day] || []).filter(m => {
                    const h = Math.floor(m / 60);
                    const min = m % 60;
                    return h >= START_HOUR && h < END_HOUR && SELECTABLE_MINUTES.includes(min);
                });
            });
            return s;
        };

        const slotLength = minute => {
            const idx = SELECTABLE_MINUTES.indexOf(minute % 60);
            if (idx >= 0 && idx < SELECTABLE_MINUTES.length - 1)
                return SELECTABLE_MINUTES[idx + 1] - minute % 60;
            if (idx === SELECTABLE_MINUTES.length - 1)
                return 60 - minute % 60;
            return 5;
        };

        const blocks = mins => {
            if (!mins.length) return [];
            const sorted = [...mins].sort((a,b)=>a-b);
            const out = [];
            let s = sorted[0], e = sorted[0];
            for (let i=1;i<sorted.length;i++) {
                if (sorted[i] === sorted[i-1] + slotLength(sorted[i-1])) e = sorted[i];
                else { out.push({s,e}); s = e = sorted[i]; }
            }
            out.push({s,e});
            return out.map(b => ({
                start: b.s,
                end: b.e + slotLength(b.e),
                last: b.e
            }));
        };

        const totalMinutes = (day, sched) =>
            blocks(sched[day] || []).reduce((s,b)=>s+(b.end-b.start),0);

        const slotState = (day, minute) => {
            if (!teamSchedule[day]?.includes(minute)) return "bg-unselectable";
            const inC = currentSchedule[day].includes(minute);
            const inM = masterSchedule[day].includes(minute);

            if (editBase) return inC ? "bg-blue-slot" : "bg-empty-slot";
            if (inC && !inM) return "bg-green-slot";
            if (!inC && inM) return "bg-red-slot";
            if (inC && inM) return "bg-blue-slot";
            return "bg-empty-slot";
        };

        function addShiftLabels(day, blocks, rowIndex) {
            blocks.forEach(b => {
                const startMin = b.start % 60;
                const startHour = Math.floor(b.start / 60);

                const lastMin = b.last % 60;
                const lastHour = Math.floor(b.last / 60);

                const startCol =
                    2 +
                    (startHour - START_HOUR) * SELECTABLE_MINUTES.length +
                    SELECTABLE_MINUTES.indexOf(startMin);

                const endCol =
                    3 +
                    (lastHour - START_HOUR) * SELECTABLE_MINUTES.length +
                    SELECTABLE_MINUTES.indexOf(lastMin);

                
                if (startMin !== 0) {
                    const lbl = document.createElement("div");
                    lbl.className = "shift-label start-label";
                    lbl.textContent =
                        `${startHour % 12 || 12}:${String(startMin).padStart(2, "0")}`;
                    lbl.style.gridRowStart = rowIndex;
                    lbl.style.gridColumnStart = startCol;
                    container.appendChild(lbl);
                }

                
                if (lastMin !== 50) {
                    const lbl = document.createElement("div");
                    lbl.className = "shift-label end-label";
                    lbl.textContent =
                        `${lastHour % 12 || 12}:${String(b.end % 60).padStart(2, "0")}`;
                    lbl.style.gridRowStart = rowIndex;
                    lbl.style.gridColumnStart = endCol;
                    container.appendChild(lbl);
                }
            });
        }



         

        masterSchedule = sanitize(baseScheduleJson);
        teamSchedule = availableSchedule();
        currentSchedule = Object.keys(newScheduleJson||{}).length
            ? sanitize(newScheduleJson)
            : clone(masterSchedule);

         

        function render(editing) {
            container.innerHTML = "";
            container.classList.toggle("is-editable", editing);

            const cols = (END_HOUR - START_HOUR) * SELECTABLE_MINUTES.length;
            const rows = DAYS.length + 1; 
            container.style.gridTemplateRows =
                `auto repeat(${rows - 1}, 2rem)`;

            container.style.gridTemplateColumns =
                `auto repeat(${cols}, minmax(0,1fr)) auto`;

            for (let h=START_HOUR;h<END_HOUR;h++) {
                const d = document.createElement("div");
                d.className = "schedule-hour-header";
                d.textContent = (h%12||12)+(h<12?" am":" pm");
                d.style.gridColumnStart =
                    2+(h-START_HOUR)*SELECTABLE_MINUTES.length;
                d.style.gridRowStart = 1;
                container.appendChild(d);
            }

            
            for (let h = START_HOUR + 1; h < END_HOUR; h++) {
                const divider = document.createElement("div");
                divider.className = "hour-divider";
                divider.style.gridColumnStart =
                    2 + (h - START_HOUR) * SELECTABLE_MINUTES.length;
                divider.style.gridColumnEnd = "span 1";
                
                container.appendChild(divider);
            }

            DAYS.forEach((day,row)=> {
                const lbl = document.createElement("div");
                lbl.className = "day-label";
                lbl.textContent = day;
                lbl.style.gridRowStart = row+2;
                lbl.style.gridColumnStart = 1;
                container.appendChild(lbl);

                for (let h=START_HOUR;h<END_HOUR;h++) {
                    SELECTABLE_MINUTES.forEach((m,i)=> {
                    const min = h*60+m;
                    const c = document.createElement("div");
                    c.className = "schedule-cell " + slotState(day,min);
                    c.dataset.day = day;
                    c.dataset.minute = min;
                    c.style.gridRowStart = row+2;
                    c.style.gridColumnStart =
                        2+(h-START_HOUR)*SELECTABLE_MINUTES.length+i;

                    
                    const label = describeSlot(day, min);
                    c.setAttribute("role", "gridcell");
                    c.setAttribute("aria-label", label);
                    c.tabIndex = teamSchedule[day]?.includes(min) ? 0 : -1;
                    c.title = label;

                    if (editing && teamSchedule[day]?.includes(min)) {
                        c.addEventListener("mousedown", ()=>beginDrag(day,min));
                    }

                    container.appendChild(c);
                    });
                }

                const dayBlocks = blocks(currentSchedule[day] || []);
                addShiftLabels(day, dayBlocks, row + 2);

                const t = document.createElement("div");
                t.id = scheduleName+"-total-hours-"+day;
                t.className = "schedule-cell day-total-hours";
                t.style.gridRowStart = row+2;
                t.style.gridColumnStart = cols+2;
                container.appendChild(t);
            });


            updateTotals();
        }

         

        function beginDrag(day, minute) {
            if (!container.classList.contains("is-editable")) return;
            isDragging = true;
            dragMode = currentSchedule[day].includes(minute) ? "remove" : "add";
            toggleMinute(day, minute);
        }

        function toggleMinute(day, minute) {
            if (!teamSchedule[day]?.includes(minute)) return;
            const arr = currentSchedule[day];
            const idx = arr.indexOf(minute);
            if (dragMode==="add" && idx===-1) {
                const nextSchedule = {...currentSchedule, [day]: [...arr, minute]};
                if (totalMinutes(day, nextSchedule) / 60 > MAX_HOURS_PER_DAY) return;
                arr.push(minute);
            }
            if (dragMode==="remove" && idx!==-1) arr.splice(idx,1);
            arr.sort((a,b)=>a-b);

            const cell = container.querySelector(
                `[data-day="${day}"][data-minute="${minute}"]`
            );
            if (cell) cell.className = "schedule-cell "+slotState(day,minute);
            if (cell) {
                const label = describeSlot(day, minute);
                cell.setAttribute("aria-label", label);
                cell.title = label;
            }

            updateTotals();
        }

         

        function updateTotals() {
            let total=0;
            DAYS.forEach(day=>{
                const mins = totalMinutes(day,currentSchedule);
                total+=mins;
                const el=document.getElementById(scheduleName+"-total-hours-"+day);
                if (!el) return;
                let html=mins?`<strong>${(mins/60).toFixed(2)} hrs</strong>`:"Off";
                if (!editBase) {
                    const diff=mins-totalMinutes(day,masterSchedule);
                    if (diff!==0) {
                        html+=` <span class="${diff>0?"text-green-600":"text-red-600"} text-xs">
                            (${diff>0?"+":""}${(diff/60).toFixed(2)})
                        </span>`;
                    }
                }
                el.innerHTML=html;
            });
            totalEl.textContent=`(${(total/60).toFixed(2)} hrs)`;
        }

         

        if (editable) {
            editBtn.onclick=()=>{
                originalSchedule=clone(currentSchedule);
                editBtn.classList.add("hidden");
                cancelBtn.classList.remove("hidden");
                submitBtn.classList.remove("hidden");
                render(true);
            };

            cancelBtn.onclick=()=>{
                currentSchedule=clone(originalSchedule);
                if (editBase) masterSchedule=clone(currentSchedule);
                cancelBtn.classList.add("hidden");
                submitBtn.classList.add("hidden");
                editBtn.classList.remove("hidden");
                render(false);
            };

            submitBtn.onclick=(event)=>{
                event.preventDefault();
                for (const day of DAYS) {
                    const hours = totalMinutes(day, currentSchedule) / 60;
                    if (hours > 0 && hours < MIN_HOURS_PER_DAY) {
                        window.alert(`${day} must have at least ${MIN_HOURS_PER_DAY} hours.`);
                        return;
                    }
                    if (hours > MAX_HOURS_PER_DAY) {
                        window.alert(`${day} cannot exceed ${MAX_HOURS_PER_DAY} hours.`);
                        return;
                    }
                }

                scheduleInput.value = JSON.stringify(currentSchedule);
                htmx.trigger(submitForm, "submit");
            };

            submitForm.addEventListener("htmx:afterRequest", event => {
                if (!event.detail.successful) return;
                cancelBtn.classList.add("hidden");
                submitBtn.classList.add("hidden");
                editBtn.classList.remove("hidden");
                render(false);
            });
        }

        container.addEventListener("mouseover",e=>{
            if (isDragging && e.target.dataset.minute)
                toggleMinute(e.target.dataset.day,+e.target.dataset.minute);
        });

        document.addEventListener("mouseup",()=>{
            isDragging=false;
            dragMode=null;
        });

        render(false);
    });

    if (document.readyState !== "loading") {
        window.__scheduleInits.forEach(fn=>fn());
        window.__scheduleInits=[];
    } else {
        document.addEventListener("DOMContentLoaded",()=>{
            window.__scheduleInits.forEach(fn=>fn());
            window.__scheduleInits=[];
        });
    }

})(
    "id-a82dd6d7-f6de-4617-8432-85bc55ec8091",
    {"Fri":[],"Mon":[],"Sat":[],"Sun":[],"Thu":[],"Tue":[],"Wed":[]},
    {"Fri":[],"Mon":[],"Sat":[],"Sun":[],"Thu":[],"Tue":[],"Wed":[]},
    {"Fri":[],"Sat":[],"Sun":[],"Thu":[],"Tue":[]},
     true ,
     true ,
    "\/schedule\/master?team=277\u0026user=2506\u0026semester=20265",
     0 
);
</script>
